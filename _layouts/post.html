---
layout: default
---
<main class="wrap">
  <article>
    <header class="article-header">
      <div class="eyebrow">{{ page.category | default: 'Blog' | escape }}{% if page.date %} · <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d. %-m. %Y' }}</time>{% endif %}</div>
      <h1>{{ page.title | escape }}</h1>
      {% if page.description %}<p style="color:var(--muted);font-size:1.08rem;line-height:1.7">{{ page.description | escape }}</p>{% endif %}
    </header>
    <div class="article-body">
      {{ content }}
      <nav class="article-bottom" aria-label="Navigace po článku">
        <a href="{{ '/blog/' | relative_url }}">← Zpět na všechny články</a>
      </nav>
    </div>
  </article>
</main>
