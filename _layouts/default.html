<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} | {% endif %}Nela Vojtová</title><meta name="description" content="{{ page.description | default: 'Blog Nely Vojtové: koučink, seberozvoj, duševní zdraví, knihy, podcasty a osobní zkušenosti.' | strip_html | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}"><meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}"><meta property="og:locale" content="cs_CZ"><meta property="og:title" content="{{ page.title | default: 'Blog' | escape }} | Nela Vojtová"><meta property="og:description" content="{{ page.description | default: 'Koučink, seberozvoj, duševní zdraví, knihy a osobní zkušenosti.' | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ '/social-preview.jpg' | absolute_url }}"><meta name="twitter:card" content="summary_large_image"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ '/blog/style.css' | relative_url }}"></head><body><header class="wrap nav"><a class="brand" href="/">NELA VOJTOVÁ</a><button class="mobile-menu-toggle" type="button" aria-label="Otevřít navigaci" aria-expanded="false" aria-controls="mobile-site-nav">☰</button><nav id="mobile-site-nav" aria-label="Hlavní navigace" class="links"><a href="/#o-mne">O mně</a><a href="/#co-je-koucink">Koučink</a><a href="/#peer-podpora">Peer podpora</a><a class="active" href="/blog/">Články</a><a href="/#kontakt">Kontakt</a><a class="mobile-booking" href="/#kontakt">Domluvit si sezení →</a></nav><a class="button" href="/#kontakt">Domluvit si sezení</a></header>{{ content }}<footer class="wrap footer"><div><a class="brand" href="/">NELA VOJTOVÁ</a><div class="small">Koučink &amp; neformální peer podpora</div></div><div><a href="mailto:koucink@nelavojtova.cz">koucink@nelavojtova.cz</a></div><div class="footlinks"><a href="/#o-mne">O mně</a><a href="/#sluzby">Služby</a><a href="/#o-mne">Přístup</a><a href="/blog/">Články</a><a href="/#kontakt">Kontakt</a></div></footer><script>(function(){var header=document.querySelector('header.nav');if(!header)return;var toggle=header.querySelector('.mobile-menu-toggle');if(!toggle)return;function close(){header.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Otevřít navigaci');toggle.textContent='☰'}toggle.addEventListener('click',function(){var opened=header.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',String(opened));toggle.setAttribute('aria-label',opened?'Zavřít navigaci':'Otevřít navigaci');toggle.textContent=opened?'×':'☰'});header.querySelectorAll('.links a').forEach(function(a){a.addEventListener('click',close)});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});window.addEventListener('resize',function(){if(window.innerWidth>850)close()})})();</script><script>/* Hide the mobile header on downward scroll; reveal on upward scroll. */
(function(){var header=document.querySelector('header.nav');if(!header)return;var last=window.scrollY;var ticking=false;function update(){ticking=false;var y=Math.max(0,window.scrollY);if(window.innerWidth>850){header.classList.remove('nav-hidden');last=y;return}if(header.classList.contains('menu-open')||y<90){header.classList.remove('nav-hidden');last=y;return}if(y>last+5){header.classList.add('nav-hidden')}else if(y<last-5){header.classList.remove('nav-hidden')}last=y}window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});window.addEventListener('resize',update);var toggle=header.querySelector('.mobile-menu-toggle');if(toggle)toggle.addEventListener('click',function(){header.classList.remove('nav-hidden')});update()})();
</script></body></html>
